<ng-content select="[before]" />

<td class="kind">
  <!-- a channel of each universe ("Channel (U2)"), then memory, fixture, group, effect and release -->
  <select
    [disabled]="locked()"
    [attr.aria-label]="kindLabel()"
    (change)="onTarget($event)"
  >
    @for (choice of kinds(); track choice.value) {
      <option
        [value]="choice.value"
        [selected]="choice.value === kind()"
        [style.--kind]="choice.color"
      >
        {{ choice.text }}
      </option>
    }
  </select>
</td>
<td class="number">
  <!-- The whole list is filled in when the field is about to be used. Until then, and again
       once the field is left, it holds only the number it shows. -->
  <select
    [disabled]="locked()"
    [attr.aria-label]="numberLabel()"
    (pointerdown)="fillList()"
    (focus)="fillList()"
    (blur)="dropList()"
    (change)="onNumber($event)"
  >
    @if (listed()) {
      @for (choice of list(); track choice.number) {
        <option
          [value]="choice.number"
          [selected]="choice.number === step().number"
        >
          {{ choice.text }}
        </option>
      }
    } @else {
      <option selected [value]="step().number">{{ shown() }}</option>
    }
  </select>
</td>
<td class="note" [attr.title]="note() || null">
  @if (lights()) {
    <button
      type="button"
      class="swatch"
      [style.--swatch]="step().color ?? '#ffffff'"
      [disabled]="locked()"
      [attr.aria-label]="label() + ', color'"
      [title]="step().color ? 'Color ' + step().color : 'White'"
      (click)="colorPick.emit()"
    ></button>
  }
  {{ note() }}
</td>
@if (release()) {
  <!-- a release has no value and no way up: it takes its step down in its own down time -->
  <td class="unused" title="A release has no value">
    <span aria-hidden="true">—</span><span class="for-readers">{{ label() }} has no value</span>
  </td>
  <td class="unused" title="A release has no up time: it takes its step down in its down time">
    <span aria-hidden="true">—</span><span class="for-readers">{{ label() }} has no up time</span>
  </td>
} @else {
  <td>
    <input
      type="text"
      inputmode="numeric"
      maxlength="3"
      autocomplete="off"
      [disabled]="locked()"
      [value]="step().value"
      [attr.aria-label]="label() + ', value, 0 to 255'"
      (change)="onValue($event)"
      (keydown.enter)="finish($event)"
    />
  </td>
  <td>
    <input
      type="text"
      inputmode="decimal"
      maxlength="5"
      autocomplete="off"
      [disabled]="locked()"
      [value]="seconds(step().up)"
      [attr.aria-label]="label() + ', up time in seconds'"
      (change)="onTime('up', $event)"
      (keydown.enter)="finish($event)"
    />
  </td>
}
<td>
  <input
    type="text"
    inputmode="decimal"
    maxlength="5"
    autocomplete="off"
    [disabled]="locked()"
    [value]="seconds(step().wait)"
    [attr.aria-label]="label() + ', wait time in seconds'"
    (change)="onTime('wait', $event)"
    (keydown.enter)="finish($event)"
  />
</td>
<td>
  <input
    type="text"
    inputmode="decimal"
    maxlength="5"
    autocomplete="off"
    [disabled]="locked()"
    [value]="seconds(step().down)"
    [attr.aria-label]="label() + ', down time in seconds'"
    (change)="onTime('down', $event)"
    (keydown.enter)="finish($event)"
  />
</td>

<ng-content select="[after]" />
