<h2>Ind</h2>

<div class="keys" [lmKeyColumns]="keyCount()">
  <button
    lmLamp
    type="button"
    tone="ind-edit"
    aria-label="Edit the channels, memories and effects of the independent keys"
    data-action="ind.edit"
    [level]="editing() ? 3 : 1"
    [blink]="editing()"
    [disabled]="store.live()"
    [attr.aria-pressed]="editing()"
    (click)="toggleEditing()"
  >
    Edit
  </button>

  <!-- the green keys for channels -->
  @for (item of channelKeys(); track item.number) {
    @if (editing()) {
      <!-- "113 U2" in a project of several universes: letters as well as digits -->
      <input
        class="field channel"
        type="text"
        maxlength="9"
        autocomplete="off"
        [attr.inputmode]="item.universe ? 'text' : 'numeric'"
        [value]="item.field"
        [attr.aria-label]="'Channel of independent key ' + item.number"
        (change)="onChannelTyped(item.number, $event)"
        (keydown.enter)="leaveField($event)"
      />
    } @else {
      <button
        lmLamp
        type="button"
        class="number"
        tone="channel"
        [level]="item.on ? 3 : 1"
        [attr.aria-pressed]="item.on"
        [attr.aria-label]="'Independent ' + item.number + ', channel ' + item.label"
        [attr.data-action]="'ind.channel.' + item.number"
        (click)="store.toggleIndependent(item.number)"
        (pointerdown)="hold('channel', item.number, $event)"
        (pointerup)="store.holdIndependent('channel', item.number, false)"
        (pointercancel)="store.holdIndependent('channel', item.number, false)"
        (lostpointercapture)="store.holdIndependent('channel', item.number, false)"
        (keydown)="holdByKey('channel', item.number, $event, true)"
        (keyup)="holdByKey('channel', item.number, $event, false)"
      >
        {{ item.caption }}
        @if (item.universe) {
          <small class="universe" aria-hidden="true">{{ item.universe }}</small>
        }
      </button>
    }
  }

  <!-- the red keys for memories -->
  @for (item of memoryKeys(); track item.number) {
    @if (editing()) {
      <input
        class="field memory"
        type="text"
        inputmode="numeric"
        maxlength="3"
        autocomplete="off"
        [class.first-memory]="$first"
        [value]="item.memory"
        [attr.aria-label]="'Memory of independent key ' + item.name"
        (change)="onMemoryTyped(item.number, $event)"
        (keydown.enter)="leaveField($event)"
      />
    } @else {
      <button
        lmLamp
        type="button"
        class="number"
        [class.first-memory]="$first"
        [tone]="item.tone"
        [level]="item.lamp"
        [attr.aria-pressed]="item.on"
        [attr.aria-label]="'Independent ' + item.name + ', memory ' + item.memory"
        [attr.data-action]="'ind.memory.' + item.number"
        (click)="store.toggleMemoryIndependent(item.number)"
        (pointerdown)="hold('memory', item.number, $event)"
        (pointerup)="store.holdIndependent('memory', item.number, false)"
        (pointercancel)="store.holdIndependent('memory', item.number, false)"
        (lostpointercapture)="store.holdIndependent('memory', item.number, false)"
        (keydown)="holdByKey('memory', item.number, $event, true)"
        (keyup)="holdByKey('memory', item.number, $event, false)"
      >
        {{ item.memory }}
      </button>
    }
  }

  <!-- the violet keys for effects: each starts and stops its effect -->
  @for (item of effectKeys(); track item.number) {
    @if (editing()) {
      <input
        class="field effect"
        type="text"
        inputmode="numeric"
        maxlength="2"
        autocomplete="off"
        [class.first-effect]="$first"
        [value]="item.effect"
        [attr.aria-label]="'Effect of independent key ' + item.name"
        (change)="onEffectTyped(item.number, $event)"
        (keydown.enter)="leaveField($event)"
      />
    } @else {
      <button
        lmLamp
        type="button"
        class="number"
        tone="effect"
        [class.first-effect]="$first"
        [level]="item.lamp"
        [blink]="item.fading"
        [attr.aria-pressed]="item.on"
        [attr.aria-label]="
          'Independent ' +
          item.name +
          ', effect ' +
          item.effect +
          (item.called ? ', ' + item.called : '')
        "
        [attr.data-action]="'ind.effect.' + item.number"
        [title]="item.called || null"
        (click)="store.toggleEffectIndependent(item.number)"
      >
        {{ item.effect }}
      </button>
    }
  }
</div>
