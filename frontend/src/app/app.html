<!-- Without the desk program nothing can be operated, so the desk is switched off until it answers. -->
<div class="desk" [attr.inert]="store.online() ? null : ''" [class.off]="!store.online()">
  <lm-top-bar />
  <main>
    <!-- the view chosen in the top bar is put in right after this element -->
    <router-outlet />
  </main>
</div>

@if (!store.online()) {
  <div class="offline" role="status">
    <h2>The desk program is not running</h2>
    <p>Start it, and this page connects by itself:</p>
    <code>run.cmd</code>
  </div>
}

@if (store.notice()) {
  <p class="notice" role="status">{{ store.notice() }}</p>
}

@if (keyboard.listening()) {
  <!-- The Keyboard view is waiting for a key of the desk to be clicked: it gets picked, not pressed. -->
  <p class="listening" role="status">
    Listening: click the key you want a shortcut for. It is not pressed, only picked.
    <button type="button" (click)="keyboard.stopListening()">Stop (Esc)</button>
  </p>
}
