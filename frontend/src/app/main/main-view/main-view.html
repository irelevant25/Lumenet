<lm-channel-section />
<lm-memory-section />
@if (effectRow()) {
  <!-- fetched the first time Settings shows the row -->
  @defer (on immediate) {
    <lm-effect-section />
  }
}
@if (soundRow()) {
  @defer (on immediate) {
    <lm-sound-section />
  }
}
<!-- At the right: the stack across the top, and under it the master over the record keys, the
     general section, the sound section and the independents, each in a column of its own. -->
<div class="side">
  <lm-stack-section />
  <div class="first">
    <lm-master-section />
    <lm-record-section />
  </div>
  <lm-general-section />
  <lm-sound-master />
  @if (independents()) {
    <lm-independents />
  }
</div>
