<div class="head">
  <h2>Channels</h2>
  @if (universeKeys().length > 0) {
    <!-- a project of several universes: a key for each, the one shown lit -->
    <nav class="universes" aria-label="Universes">
      @for (item of universeKeys(); track item.universe) {
        <button
          lmLamp
          type="button"
          tone="channel"
          [level]="item.lamp"
          [attr.aria-pressed]="item.shown"
          [attr.aria-label]="'Universe ' + item.universe"
          [attr.data-action]="'universe.' + item.universe"
          (click)="store.showUniverse(item.universe)"
        >
          U{{ item.universe }}
        </button>
      }
    </nav>
  }
</div>

<div class="body">
  <div class="rows big-scrollbar">
    @for (row of rows(); track $index) {
      <div class="row">
        @for (channel of row; track $index) {
          <lm-fader-strip
            kind="channel"
            [blink]="armed()"
            [steps]="steps(channel)"
            [number]="channel"
            [caption]="caption(channel)"
            [called]="called(channel)"
            [value]="store.shownChannels()[channel - 1]"
            [ownLevel]="store.channels()[channel - 1]"
            [lampLevel]="lamp(channel)"
            [note]="store.channelNotes()[channel - 1]"
            [fixture]="store.fixtureLabels()[channel - 1]"
            [locked]="store.live()"
            (valueChange)="store.setChannel(channel, $event)"
            (noteChange)="store.setChannelNote(channel, $event)"
            (keyPress)="store.pressChannel(channel)"
            (keyHold)="store.holdKey('channel', channel, $event)"
          />
        }
      </div>
    }
  </div>

  <nav class="rail" aria-label="Channel pages" [lmKeyColumns]="pages().length" lmKeyLines="2">
    @for (item of pages(); track item.first) {
      <button
        lmLamp
        type="button"
        class="range"
        tone="channel"
        [level]="item.lamp"
        [attr.aria-pressed]="item.shown"
        [attr.aria-label]="item.name"
        [attr.data-action]="'page.channel.' + ($index + 1)"
        (click)="store.showChannelPage(item.first)"
      >
        {{ item.from }}-<wbr />{{ item.to }}
      </button>
    }
  </nav>
</div>
