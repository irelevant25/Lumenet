<ng-content select="[before]" />

<td class="kind">
  <select
    [disabled]="locked()"
    [attr.aria-label]="label() + ', channel or memory'"
    (change)="onTarget($event)"
  >
    <option value="channel" [selected]="step().target === 'channel'">Channel</option>
    <option value="memory" [selected]="step().target === 'memory'">Memory</option>
  </select>
</td>
<td class="number">
  <!-- The whole list is filled in when the field is about to be used. Until then, and again
       when another row is used, the field holds only the number it shows. -->
  <select
    [disabled]="locked()"
    [attr.aria-label]="label() + ', number of the ' + step().target"
    (pointerdown)="fillList()"
    (focus)="fillList()"
    (change)="onNumber($event)"
  >
    @if (listed()) {
      @for (choice of list(); track choice.number) {
        <option [value]="choice.number" [selected]="choice.number === step().number">
          {{ choice.text }}
        </option>
      }
    } @else {
      <option selected [value]="step().number">{{ step().number }}</option>
    }
  </select>
</td>
<td class="note" [attr.title]="note() || null">{{ note() }}</td>
<td>
  <input
    type="text"
    inputmode="numeric"
    maxlength="3"
    autocomplete="off"
    [disabled]="locked()"
    [value]="step().value"
    [attr.aria-label]="label() + ', value, 0 to 255'"
    (change)="onValue($event)"
    (keydown.enter)="finish($event)"
  />
</td>
<td>
  <input
    type="text"
    inputmode="decimal"
    maxlength="5"
    autocomplete="off"
    [disabled]="locked()"
    [value]="seconds(step().up)"
    [attr.aria-label]="label() + ', up time in seconds'"
    (change)="onTime('up', $event)"
    (keydown.enter)="finish($event)"
  />
</td>
<td>
  <input
    type="text"
    inputmode="decimal"
    maxlength="5"
    autocomplete="off"
    [disabled]="locked()"
    [value]="seconds(step().wait)"
    [attr.aria-label]="label() + ', wait time in seconds'"
    (change)="onTime('wait', $event)"
    (keydown.enter)="finish($event)"
  />
</td>
<td>
  <input
    type="text"
    inputmode="decimal"
    maxlength="5"
    autocomplete="off"
    [disabled]="locked()"
    [value]="seconds(step().down)"
    [attr.aria-label]="label() + ', down time in seconds'"
    (change)="onTime('down', $event)"
    (keydown.enter)="finish($event)"
  />
</td>

<ng-content select="[after]" />
