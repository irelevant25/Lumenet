<div class="form">
  <label for="sound-name">Name</label>
  <input
    id="sound-name"
    type="text"
    autocomplete="off"
    [attr.maxlength]="nameLength"
    [value]="sound().name"
    [disabled]="locked()"
    (change)="onName($event)"
    (keydown.enter)="leave($event)"
  />

  @if (track()) {
    <!-- a track of the mixer's USB stick: it plays there as it is -->
    <span class="label">Track</span>
    <span class="file" [attr.title]="trackText()">{{ trackText() }}</span>
  } @else {
    <span class="label">File</span>
    <div class="pair">
      <span class="file" [attr.title]="sound().file">{{ fileText() }}</span>
      <button type="button" class="text" [disabled]="locked() || sending()" (click)="pickFile()">
        {{ sending() ? 'Sending…' : 'Another file…' }}
      </button>
      <input #picker type="file" hidden [attr.accept]="accept" (change)="onFile($event)" />
    </div>

    <span class="label">Plays</span>
    <div class="pair">
      <label
        >From
        <input
          type="number"
          min="0"
          step="0.01"
          aria-label="Where it starts in its file, seconds"
          [attr.max]="sound().seconds || null"
          [value]="sound().start"
          [disabled]="locked()"
          (change)="onStart($event)"
      /></label>
      <label
        >To
        <input
          type="number"
          min="0"
          step="0.01"
          placeholder="the end"
          aria-label="Where it ends in its file, seconds; empty for the end of the file"
          [attr.max]="sound().seconds || null"
          [value]="sound().end ?? ''"
          [disabled]="locked()"
          (change)="onEnd($event)"
      /></label>
      <span class="dim">seconds</span>
    </div>

    <label for="sound-loop">Loop</label>
    <input
      id="sound-loop"
      type="checkbox"
      class="loop"
      [checked]="sound().loop"
      [disabled]="locked()"
      (change)="onLoop($event)"
    />
  }

  <!-- its own level: a file plays at it, and a track sets PLAYER L/R on the mixer to it -->
  <label for="sound-level">Level (dB)</label>
  <div class="pair">
    <lm-fader
      orientation="horizontal"
      tone="sound"
      label="Level, from nothing at the left to its file as it is at the right"
      title="Double click: 0 dB"
      [class.off]="locked()"
      [inert]="locked()"
      [valueText]="sound().decibels + ' decibels'"
      [value]="levelPlace()"
      (valueChange)="onLevel($event)"
      (dblclick)="update({ decibels: 0 })"
    />
    <input
      id="sound-level"
      type="number"
      step="0.1"
      [min]="minDecibels"
      [max]="maxDecibels"
      [value]="sound().decibels"
      [disabled]="locked()"
      (change)="onNumber('decibels', $event, minDecibels, maxDecibels, 1)"
    />
  </div>

  <label for="sound-fade-in">Fade in (s)</label>
  <input
    id="sound-fade-in"
    type="number"
    min="0"
    step="0.1"
    [max]="maxFade"
    [value]="sound().fadeIn"
    [disabled]="locked()"
    (change)="onNumber('fadeIn', $event, 0, maxFade, 1)"
  />

  <label for="sound-fade-out">Fade out (s)</label>
  <input
    id="sound-fade-out"
    type="number"
    min="0"
    step="0.1"
    [max]="maxFade"
    [value]="sound().fadeOut"
    [disabled]="locked()"
    (change)="onNumber('fadeOut', $event, 0, maxFade, 1)"
  />

  @if (!track()) {
    <label for="sound-pan">Pan</label>
    <div class="pair">
      <lm-fader
        orientation="horizontal"
        tone="sound"
        label="Pan, from -100 all left to 100 all right"
        title="Double click: the middle"
        [class.off]="locked()"
        [inert]="locked()"
        [max]="200"
        [valueText]="'Pan ' + sound().pan"
        [value]="sound().pan + 100"
        (valueChange)="update({ pan: $event - 100 })"
        (dblclick)="update({ pan: 0 })"
      />
      <input
        id="sound-pan"
        type="number"
        min="-100"
        max="100"
        [value]="sound().pan"
        [disabled]="locked()"
        (change)="onNumber('pan', $event, -100, 100)"
      />
      <span class="dim">-100 left, 100 right</span>
    </div>

    <label for="sound-speed">Speed (×)</label>
    <div class="pair">
      <lm-fader
        orientation="horizontal"
        tone="sound"
        label="Speed, from half as fast at the left to twice as fast at the right"
        title="Double click: 1×"
        [class.off]="locked()"
        [inert]="locked()"
        [max]="200"
        [valueText]="sound().speed + ' times'"
        [value]="speedPlace()"
        (valueChange)="onSpeed($event)"
        (dblclick)="update({ speed: 1 })"
      />
      <input
        id="sound-speed"
        type="number"
        step="0.05"
        [min]="minSpeed"
        [max]="maxSpeed"
        [value]="sound().speed"
        [disabled]="locked()"
        (change)="onNumber('speed', $event, minSpeed, maxSpeed, 2)"
      />
    </div>

    <label for="sound-pitch">Pitch (semitones)</label>
    <div class="pair">
      <lm-fader
        orientation="horizontal"
        tone="sound"
        label="Pitch, semitones down at the left and up at the right"
        title="Double click: 0"
        [class.off]="locked()"
        [inert]="locked()"
        [max]="maxPitch * 2"
        [wheelStep]="1"
        [valueText]="sound().pitch + ' semitones'"
        [value]="sound().pitch + maxPitch"
        (valueChange)="update({ pitch: $event - maxPitch })"
        (dblclick)="update({ pitch: 0 })"
      />
      <input
        id="sound-pitch"
        type="number"
        step="1"
        [min]="-maxPitch"
        [max]="maxPitch"
        [value]="sound().pitch"
        [disabled]="locked()"
        (change)="onNumber('pitch', $event, -maxPitch, maxPitch)"
      />
    </div>

    <label for="sound-echo">Echo (%)</label>
    <div class="pair">
      <lm-fader
        orientation="horizontal"
        tone="sound"
        label="Echo, per cent"
        title="Double click: none"
        [class.off]="locked()"
        [inert]="locked()"
        [max]="100"
        [valueText]="sound().echo + ' per cent'"
        [value]="sound().echo"
        (valueChange)="update({ echo: $event })"
        (dblclick)="update({ echo: 0 })"
      />
      <input
        id="sound-echo"
        type="number"
        min="0"
        max="100"
        [value]="sound().echo"
        [disabled]="locked()"
        (change)="onNumber('echo', $event, 0, 100)"
      />
    </div>
    @if (sound().echo > 0) {
      <span class="label">Its repeats</span>
      <div class="pair">
        <label
          >Every
          <input
            type="number"
            step="0.01"
            aria-label="Seconds between the repeats of the echo"
            [min]="minEchoTime"
            [max]="maxEchoTime"
            [value]="sound().echoTime"
            [disabled]="locked()"
            (change)="onNumber('echoTime', $event, minEchoTime, maxEchoTime, 2)"
        /></label>
        <span class="dim">s,</span>
        <label
          >each
          <input
            type="number"
            min="0"
            aria-label="How much of the echo comes back for the next repeat, per cent"
            [max]="maxEchoRepeats"
            [value]="sound().echoRepeats"
            [disabled]="locked()"
            (change)="onNumber('echoRepeats', $event, 0, maxEchoRepeats)"
        /></label>
        <span class="dim">% of the one before</span>
      </div>
    }

    <label for="sound-reverb">Reverb (%)</label>
    <div class="pair">
      <lm-fader
        orientation="horizontal"
        tone="sound"
        label="Reverb, per cent"
        title="Double click: none"
        [class.off]="locked()"
        [inert]="locked()"
        [max]="100"
        [valueText]="sound().reverb + ' per cent'"
        [value]="sound().reverb"
        (valueChange)="update({ reverb: $event })"
        (dblclick)="update({ reverb: 0 })"
      />
      <input
        id="sound-reverb"
        type="number"
        min="0"
        max="100"
        [value]="sound().reverb"
        [disabled]="locked()"
        (change)="onNumber('reverb', $event, 0, 100)"
      />
    </div>
    @if (sound().reverb > 0) {
      <!-- how big the room of the reverb is: how long it rings -->
      <label for="sound-room">Room size (%)</label>
      <div class="pair">
        <lm-fader
          orientation="horizontal"
          tone="sound"
          label="Room size of the reverb, from a small room at the left to a big hall at the right"
          title="Double click: 50"
          [class.off]="locked()"
          [inert]="locked()"
          [max]="100"
          [valueText]="sound().room + ' per cent'"
          [value]="sound().room"
          (valueChange)="update({ room: $event })"
          (dblclick)="update({ room: 50 })"
        />
        <input
          id="sound-room"
          type="number"
          min="0"
          max="100"
          [value]="sound().room"
          [disabled]="locked()"
          (change)="onNumber('room', $event, 0, 100)"
        />
        <span class="dim">0 a small room, 100 a big hall</span>
      </div>
    }
  }
</div>
