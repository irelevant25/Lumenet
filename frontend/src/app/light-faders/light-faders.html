<div class="faders" role="group" aria-label="Faders of the light">
  @for (fader of faders(); track fader.channel) {
    <div class="strip" (focusin)="touch(fader.channel)">
      <span class="level" aria-hidden="true" [class.up]="fader.level > 0">{{ fader.level }}</span>
      <lm-fader
        [label]="fader.label"
        [value]="fader.level"
        [ownLevel]="fader.own"
        [valueText]="fader.valueText"
        [style.--lamp]="fader.color"
        (valueChange)="move(fader.channel, $event)"
      />
      <span class="letter" aria-hidden="true" [title]="fader.about">{{ fader.letter }}</span>
      <span class="number" aria-hidden="true">{{ fader.channel }}</span>
    </div>
  }
</div>
<!-- what the fader moved last does at its value, so the light's manual is seldom needed -->
<p class="said" [class.hint]="!said()">
  {{
    said() ??
      (hasBands()
        ? 'Move a fader to see here what its value does; the pointer on its letter shows all its values.'
        : 'Move a fader to see here what its value does.')
  }}
</p>
