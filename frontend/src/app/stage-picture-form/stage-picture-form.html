<h3>Picture</h3>
<div class="keys">
  <button type="button" [disabled]="busy()" (click)="file.click()">
    {{ store.stagePicture() ? 'Another picture…' : 'Choose a picture…' }}
  </button>
  <input #file type="file" accept="image/*" hidden (change)="onFile($event)" />
</div>
@if (problem()) {
  <p class="problem" role="alert">{{ problem() }}</p>
}

@if (store.stagePicture()) {
  <!-- one row for each: the label at the left, its field at the right -->
  <div class="form">
    <label for="picture-over">Lies under</label>
    <select id="picture-over" (change)="setOver($event)">
      <option value="stage" [selected]="store.stage().pictureOver === 'stage'">The stage</option>
      <option value="plan" [selected]="store.stage().pictureOver === 'plan'">The whole plan</option>
    </select>

    <label for="picture-opacity">Shows through</label>
    <span class="pair">
      <input
        id="picture-opacity"
        type="range"
        min="10"
        max="100"
        step="5"
        [value]="opacity()"
        (input)="previewOpacity($event)"
        (change)="setOpacity($event)"
      />
      <output for="picture-opacity">{{ opacity() }} %</output>
    </span>
  </div>
  <div class="keys">
    <button type="button" (click)="fit()">Fit the stage to it</button>
    <button type="button" (click)="remove()">Remove the picture</button>
  </div>
}
<p class="hint">
  A photo or a drawing of the stage, under the grid and the lights. A new picture gives the stage
  its proportions (its depth changes); the page makes it smaller first, to at most 1600 pixels.
</p>
