<h2>Master</h2>

<button lmLamp type="button" tone="clear" data-action="master.clear" [level]="3" (click)="store.clear()">Clear</button>
<!-- Lit: the keys under the faders and the independent keys hold their fader at full only while they are held. -->
<button
  lmLamp
  type="button"
  tone="solo"
  aria-label="Solo"
  data-action="master.solo"
  title="While lit, a key under a fader or of the independents puts its fader to full only while it is held"
  [level]="store.soloMode() ? 3 : 1"
  [attr.aria-pressed]="store.soloMode()"
  (click)="store.toggleSolo()"
>
  Solo
</button>
<button
  lmLamp
  type="button"
  tone="blackout"
  aria-label="Blackout"
  data-action="master.blackout"
  [level]="1"
  [blink]="store.blackout()"
  [attr.aria-pressed]="store.blackout()"
  (click)="store.toggleBlackout()"
>
  Black<br />out
</button>

<!-- The level stands above the fader, as on every other fader. -->
<span class="readout" aria-hidden="true" [class.up]="store.master() > 0">{{ store.master() }}</span>
<!-- The fader stands in the column and lies in the line of the mobile layout. -->
<lm-fader
  tone="system"
  label="Master"
  [orientation]="store.mobile() ? 'horizontal' : 'vertical'"
  [value]="store.master()"
  (valueChange)="store.setMaster($event)"
/>

<!-- The rate, a speed master for the sequences: RATE switches it, the wheel sets it. -->
<div class="rate">
  <button
    lmLamp
    type="button"
    tone="rate"
    aria-label="Rate"
    data-action="master.rate"
    title="While lit, every sequence plays at its own speed times the rate of the wheel"
    [level]="store.rateOn() ? 3 : 1"
    [attr.aria-pressed]="store.rateOn()"
    (click)="store.toggleRate()"
  >
    Rate
  </button>
  <lm-rate-wheel [value]="store.rate()" [disabled]="!store.rateOn()" (valueChange)="store.setRate($event)" />
  <output class="rate-value" [class.on]="store.rateOn()">×{{ store.rate().toFixed(2) }}</output>
</div>
