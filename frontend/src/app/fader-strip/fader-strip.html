<span class="readout" aria-hidden="true">{{ value() }}</span>

<!-- data-fader: its name for MIDI ("fader.channel.12"), for Listen of the MIDI view -->
<lm-fader
  [attr.data-fader]="'fader.' + kind() + '.' + number()"
  [value]="value()"
  [ownLevel]="ownLevel()"
  [label]="name()"
  [tone]="kind()"
  (valueChange)="valueChange.emit($event)"
/>

<button
  lmLamp
  type="button"
  class="number"
  [class.marked]="steps().length > 0"
  [tone]="keyTone()"
  [level]="lampLevel()"
  [blink]="blink()"
  [attr.aria-label]="keyName()"
  [attr.data-action]="kind() + '.' + number()"
  (click)="keyPress.emit()"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="keyHold.emit(false)"
  (pointercancel)="keyHold.emit(false)"
  (lostpointercapture)="keyHold.emit(false)"
  (keydown)="onKey($event, true)"
  (keyup)="onKey($event, false)"
>
  @if (steps().length) {
    <!-- the steps of the sequence being recorded that use this key -->
    <span class="steps" aria-hidden="true">{{ steps().join(',') }}</span>
  }
  {{ caption() ?? number() }}
</button>

@if (kind() === 'effect' && choosable()) {
  <button
    type="button"
    class="note chooser"
    [class.chosen]="chosen()"
    [attr.aria-pressed]="chosen()"
    [attr.aria-label]="'Edit ' + name() + (note() ? ', ' + note() : '')"
    (click)="choose.emit()"
  >
    <span>{{ nameLines()[0] || '—' }}</span>
    <span>{{ nameLines()[1] }}</span>
  </button>
} @else if (kind() === 'effect') {
  <div class="note" [attr.title]="note() || null">
    <span>{{ nameLines()[0] }}</span>
    <span>{{ nameLines()[1] }}</span>
  </div>
} @else {
  <div class="note" [attr.title]="noteTitle()">
    <input
      type="text"
      autocomplete="off"
      spellcheck="false"
      [attr.maxlength]="lineLength"
      [attr.placeholder]="fixtureLines()[0] || null"
      [value]="lines()[0]"
      [readOnly]="locked()"
      [attr.aria-label]="'Note for ' + name()"
      (change)="onLineChange(0, $event)"
      (keydown.enter)="finishNote($event)"
      (keydown.escape)="cancelNote(0, $event)"
    />
    <input
      type="text"
      autocomplete="off"
      spellcheck="false"
      [attr.maxlength]="lineLength"
      [attr.placeholder]="fixtureLines()[1] || null"
      [value]="lines()[1]"
      [readOnly]="locked()"
      [attr.aria-label]="'Note for ' + name() + ', second line'"
      (change)="onLineChange(1, $event)"
      (keydown.enter)="finishNote($event)"
      (keydown.escape)="cancelNote(1, $event)"
    />
  </div>
}
