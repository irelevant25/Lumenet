<span class="time" title="Where it is">{{ now() }}</span>
<!-- while it plays: a double click plays it from there, the arrows go back and on -->
<div
  class="well"
  [class.seekable]="playing()"
  [attr.role]="playing() ? 'slider' : null"
  [attr.tabindex]="playing() ? 0 : null"
  [attr.aria-label]="playing() ? 'Where sound ' + sound().number + ' plays' : null"
  [attr.aria-valuemin]="playing() ? 0 : null"
  [attr.aria-valuemax]="playing() ? length() : null"
  [attr.aria-valuenow]="playing() ? at() : null"
  [attr.aria-valuetext]="playing() ? now() + (total() ? ' of ' + total() : '') : null"
  [attr.title]="playing() ? 'Double click: play from there' : null"
  (dblclick)="onDoubleClick($event)"
  (keydown)="onKey($event)"
  (pointermove)="onPointerMove($event)"
  (pointerleave)="onPointerLeave()"
>
  <canvas #canvas aria-hidden="true"></canvas>
  <!-- where the pointer is: the time of the file there -->
  @if (hover(); as hover) {
    <span
      class="hover"
      [class.flip]="hover.part > 0.8"
      [style.left.%]="hover.part * 100"
      aria-hidden="true"
    >
      <span>{{ hover.time }}</span>
    </span>
  }
</div>
<span class="time total" title="How long it is">{{ total() }}</span>
