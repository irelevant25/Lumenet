<h2>Memories</h2>

<div class="body">
  <div class="rows big-scrollbar">
    @for (row of rows(); track $index) {
      <div class="row">
        @for (memory of row; track $index) {
          <lm-fader-strip
            kind="memory"
            [sequence]="isSequence(memory)"
            [steps]="steps(memory)"
            [number]="memory"
            [value]="store.memoryLevels()[memory - 1]"
            [lampLevel]="lamp(memory)"
            [blink]="blinks(memory)"
            [note]="store.memoryNotes()[memory - 1]"
            [locked]="store.live()"
            (valueChange)="store.setMemoryLevel(memory, $event)"
            (noteChange)="store.setMemoryNote(memory, $event)"
            (keyPress)="store.pressMemory(memory)"
          />
        }
      </div>
    }
  </div>

  <nav class="rail" aria-label="Memory pages" [lmKeyColumns]="pages().length" lmKeyLines="2">
    @for (item of pages(); track item.first) {
      <button
        lmLamp
        type="button"
        class="range"
        tone="memory"
        [level]="item.lamp"
        [attr.aria-pressed]="item.shown"
        [attr.aria-label]="'Memories ' + item.first + ' to ' + item.last"
        [attr.data-action]="'page.memory.' + ($index + 1)"
        (click)="store.showMemoryPage(item.first)"
      >
        {{ item.first }}-<wbr />{{ item.last }}
      </button>
    }
  </nav>
</div>
