<button
  type="button"
  class="swatch"
  [class.none]="!color()"
  [style.--swatch]="color()"
  [attr.aria-label]="name() + ': color and settings'"
  [attr.aria-pressed]="chosen()"
  (click)="choose.emit()"
></button>

<span class="readout" aria-hidden="true">{{ level() }}</span>

<lm-fader [value]="level()" [label]="name()" [tone]="group() ? 'system' : 'channel'" (valueChange)="levelChange.emit($event)" />

<button
  lmLamp
  type="button"
  class="key"
  [class.marked]="steps().length > 0"
  [tone]="group() ? 'system' : 'channel'"
  [level]="level() > 0 ? 3 : 1"
  [blink]="blink()"
  [attr.aria-label]="name() + (blink() ? ': a step of it' : ': to full, or to zero') + (steps().length ? ', in steps ' + steps().join(', ') : '')"
  (click)="keyPress.emit()"
>
  @if (steps().length) {
    <!-- the steps of the sequence being recorded that use this fixture or group -->
    <span class="steps" aria-hidden="true">{{ steps().join(',') }}</span>
  }
  {{ keyText() }}
</button>

<!-- The note under the key, as under a channel fader on the main view: two lines, each a field.
     Where nothing was typed, the name from the stage shows there, dimmed. -->
<div class="note" [attr.title]="noteTitle()">
  <input
    type="text"
    autocomplete="off"
    spellcheck="false"
    [attr.maxlength]="lineLength"
    [attr.placeholder]="nameLines()[0] || null"
    [value]="lines()[0]"
    [readOnly]="locked()"
    [attr.aria-label]="'Note for ' + name()"
    (change)="onLineChange(0, $event)"
    (keydown.enter)="finishNote($event)"
    (keydown.escape)="cancelNote(0, $event)"
  />
  <input
    type="text"
    autocomplete="off"
    spellcheck="false"
    [attr.maxlength]="lineLength"
    [attr.placeholder]="nameLines()[1] || null"
    [value]="lines()[1]"
    [readOnly]="locked()"
    [attr.aria-label]="'Note for ' + name() + ', second line'"
    (change)="onLineChange(1, $event)"
    (keydown.enter)="finishNote($event)"
    (keydown.escape)="cancelNote(1, $event)"
  />
</div>
