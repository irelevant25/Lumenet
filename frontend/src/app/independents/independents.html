<h2>Ind</h2>

<div class="keys">
  <button
    lmLamp
    type="button"
    tone="system"
    aria-label="Edit the channels and memories of the independent keys"
    [level]="editing() ? 3 : 1"
    [blink]="editing()"
    [disabled]="store.live()"
    [attr.aria-pressed]="editing()"
    (click)="toggleEditing()"
  >
    Edit
  </button>

  <!-- ten green keys for channels -->
  @for (item of channelKeys(); track item.number) {
    @if (editing()) {
      <input
        class="field channel"
        type="text"
        inputmode="numeric"
        maxlength="3"
        autocomplete="off"
        [value]="item.channel"
        [attr.aria-label]="'Channel of independent key ' + item.number"
        (change)="onChannelTyped(item.number, $event)"
        (keydown.enter)="leaveField($event)"
      />
    } @else {
      <button
        lmLamp
        type="button"
        class="number"
        tone="channel"
        [level]="item.on ? 3 : 1"
        [attr.aria-pressed]="item.on"
        [attr.aria-label]="'Independent ' + item.number + ', channel ' + item.channel"
        (click)="store.toggleIndependent(item.number)"
      >
        {{ item.channel }}
      </button>
    }
  }

  <!-- ten red keys for memories -->
  @for (item of memoryKeys(); track item.number) {
    @if (editing()) {
      <input
        class="field memory"
        type="text"
        inputmode="numeric"
        maxlength="3"
        autocomplete="off"
        [class.first-memory]="$first"
        [value]="item.memory"
        [attr.aria-label]="'Memory of independent key ' + item.name"
        (change)="onMemoryTyped(item.number, $event)"
        (keydown.enter)="leaveField($event)"
      />
    } @else {
      <button
        lmLamp
        type="button"
        class="number"
        [class.first-memory]="$first"
        [tone]="item.tone"
        [level]="item.lamp"
        [attr.aria-pressed]="item.on"
        [attr.aria-label]="'Independent ' + item.name + ', memory ' + item.memory"
        (click)="store.toggleMemoryIndependent(item.number)"
      >
        {{ item.memory }}
      </button>
    }
  }
</div>
