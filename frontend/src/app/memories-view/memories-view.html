<header>
  <h2>Memories</h2>
  <p class="summary" role="status">{{ summary() }}</p>
</header>

<div class="body">
  <div class="content">
    <div class="keys" role="group" aria-label="Memory to look at">
      @for (memory of numbers(); track memory) {
        <div class="key">
          <button
            lmLamp
            type="button"
            class="number"
            [tone]="keyTone(memory)"
            [level]="keyLamp(memory)"
            [attr.aria-pressed]="memory === store.inspectedMemory()"
            [attr.aria-label]="'Look at memory ' + memory"
            (click)="store.inspectedMemory.set(memory)"
          >
            {{ memory }}
          </button>
          <lm-note-lines [note]="store.memoryNotes()[memory - 1]" />
        </div>
      }
    </div>

    <!-- One cell for each channel: the level in the middle, the channel number (drawn by the
         style sheet from data-channel) small in the corner. One element a cell, nothing more. -->
    <div class="table-box">
      <table class="matrix">
        <caption>The channels of memory {{ store.inspectedMemory() }}</caption>
        <tbody>
          @for (row of rows(); track $index) {
            <tr>
              @for (cell of row; track cell.channel) {
                <td
                  [class.up]="cell.level > 0"
                  [style.--part]="cell.level > 0 ? cell.level / 255 : null"
                  [attr.data-channel]="cell.channel"
                  [attr.aria-label]="'Channel ' + cell.channel + ': ' + cell.level"
                >
                  {{ cell.level }}
                </td>
              }
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>

  <nav class="rail" aria-label="Memory pages">
    @for (item of pages(); track item.first) {
      <button
        lmLamp
        type="button"
        class="range"
        tone="memory"
        [level]="item.lamp"
        [attr.aria-pressed]="item.shown"
        [attr.aria-label]="'Memories ' + item.first + ' to ' + item.last"
        (click)="store.showMemoryPage(item.first)"
      >
        {{ item.first }}-{{ item.last }}
      </button>
    }
  </nav>
</div>
