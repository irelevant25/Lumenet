<h2>General</h2>

<button lmLamp type="button" tone="clear" data-action="master.clear" [level]="3" (click)="store.clear()">Clear</button>
<!-- Lit: a key under a fader or of the independents, while it is held, puts its fader to full and every other light out. -->
<button
  lmLamp
  type="button"
  tone="solo"
  aria-label="Solo up"
  data-action="master.solo"
  title="While lit, a key under a fader or of the independents puts its fader to full while it is held, and every other light out"
  [level]="store.soloMode() === 'up' ? 3 : 1"
  [attr.aria-pressed]="store.soloMode() === 'up'"
  (click)="store.toggleSoloUp()"
>
  Solo up
</button>
<!-- Lit: a key, while it is held, takes only its own fader down. -->
<button
  lmLamp
  type="button"
  tone="solo-down"
  aria-label="Solo down"
  data-action="master.solo-down"
  title="While lit, a key under a fader or of the independents takes only its own fader down while it is held"
  [level]="store.soloMode() === 'down' ? 3 : 1"
  [attr.aria-pressed]="store.soloMode() === 'down'"
  (click)="store.toggleSoloDown()"
>
  Solo down
</button>
<!-- The rate, a tempo for the sequences: RATE switches it, the fader under it and TEMPO set it. -->
<button
  lmLamp
  type="button"
  tone="rate"
  aria-label="Rate"
  data-action="master.rate"
  title="While lit, every sequence takes one step per beat of the tempo"
  [level]="store.rateOn() ? 3 : 1"
  [attr.aria-pressed]="store.rateOn()"
  (click)="store.toggleRate()"
>
  Rate
</button>

<!-- The tempo stands above its fader, as the level does above every other fader. -->
<span class="readout" aria-hidden="true" [class.up]="store.rateOn()">{{ bpmText() }}</span>
<lm-fader
  tone="system"
  label="Tempo"
  title="Double click: back to 120 BPM"
  style="--lamp: var(--key-rate)"
  [style.--mark]="mark"
  [class.off]="!store.rateOn()"
  [orientation]="store.mobile() ? 'horizontal' : 'vertical'"
  [max]="positions"
  [value]="position()"
  [valueText]="bpmSaid()"
  (valueChange)="onPosition($event)"
  (dblclick)="resetBpm()"
/>
<!-- Tapped in time with the music: the rate takes the beat of the taps. Only while RATE is lit. -->
<button
  lmLamp
  type="button"
  class="tempo"
  tone="tempo"
  aria-label="Tempo"
  data-action="master.tempo"
  title="Tap in time with the music: the rate takes the beat of the taps"
  [level]="1"
  [disabled]="!store.rateOn()"
  (click)="store.tapTempo()"
>
  Tempo
</button>
